<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별빛 수비대</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #05060f;
    overflow: hidden;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 게임 화면: 창 크기에 맞춰 4:3 비율로 커지고 작아져요 */
  #game {
    position: relative;
    width: min(100vw, calc(100vh * 4 / 3));
    aspect-ratio: 4 / 3;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  /* 시작 화면과 끝 화면: 게임 화면 위에 겹쳐서 보여줘요 */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5vmin;
    padding: 4vmin;
    text-align: center;
    color: #e8ecff;
    background: rgba(5, 6, 15, 0.72);
  }

  #title {
    margin: 0;
    font-size: 13vmin;
    font-weight: 800;
    line-height: 1.1;
    color: #ffe28a;
    text-shadow: 0 0 3vmin rgba(255, 226, 138, 0.6);
  }

  #title.lose {
    color: #ff5d6c;
    text-shadow: 0 0 3vmin rgba(255, 93, 108, 0.7);
  }

  #message {
    margin: 0;
    font-size: 3vmin;
    line-height: 1.7;
    white-space: pre-line;
  }

  #button {
    margin-top: 1.5vmin;
    padding: 1.8vmin 6vmin;
    font: inherit;
    font-size: 3.6vmin;
    font-weight: 700;
    color: #10131f;
    background: #ffe28a;
    border: none;
    border-radius: 99px;
    cursor: pointer;
  }

  #button:hover { background: #fff0bd; }
  #button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>
  <div id="overlay">
    <h1 id="title">별빛 수비대</h1>
    <p id="message">이동: ← → 방향키 또는 마우스
발사: 스페이스바 또는 마우스 클릭
초록 아이템: 10초 동안 총알 두 발 / 노란 아이템: 방어막</p>
    <button id="button" type="button">게임 시작</button>
  </div>
</div>

<script>
// ===== 1. 기본 설정 =====
// 아래 숫자를 바꾸면 게임 느낌이 달라져요. 이것저것 바꿔 보세요!
const W = 800;                // 게임 화면 가로 크기
const H = 600;                // 게임 화면 세로 크기
const SHIP_Y = 545;           // 내 우주선의 높이
const SHIP_SPEED = 400;       // 우주선 속도 (1초에 움직이는 거리)
const SHOT_SPEED = 540;       // 내 총알 속도
const SHOT_DELAY = 0.28;      // 총알을 쏘고 다음 총알까지 기다리는 시간(초)
const ROWS = 4;               // 외계인 줄 수
const COLS = 8;               // 외계인 칸 수
const ALIEN_GAP_X = 66;       // 외계인 사이 가로 간격
const ALIEN_GAP_Y = 54;       // 외계인 사이 세로 간격
const ALIEN_SPEED = 42;       // 외계인 처음 속도
const ALIEN_SPEED_UP = 5;     // 외계인이 1마리 줄 때마다 빨라지는 정도
const ALIEN_DROP = 18;        // 벽에 닿으면 내려오는 거리
const ALIEN_SHOT_SPEED = 240; // 외계인 총알 속도
const ALIEN_SCORE = 10;       // 외계인 한 마리를 맞히면 받는 점수
const START_LIVES = 3;        // 처음 목숨 수
const SAFE_TIME = 2;          // 맞은 뒤 안 다치는 시간(초)
const ITEM_CHANCE = 0.1;      // 아이템이 나올 확률 (0.1 = 10%)
const ITEM_SPEED = 150;       // 아이템이 떨어지는 속도
const DOUBLE_TIME = 10;       // 두 발 쏘기가 이어지는 시간(초)
const STAGE_SPEED_UP = 18;    // 스테이지가 오를 때마다 빨라지는 정도
const STAGE_BREAK = 2;        // 스테이지 사이에 쉬는 시간(초)
const DIVE_START_STAGE = 2;   // 급강하가 시작되는 스테이지

// 줄마다 다른 색 (맨 윗줄부터)
const ROW_COLORS = ["#ff6fb5", "#ffc94d", "#4de8b0", "#7aa2ff"];

// 화면에서 필요한 부분 찾아두기
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const titleText = document.getElementById("title");
const messageText = document.getElementById("message");
const button = document.getElementById("button");

// 그림이 또렷하게 보이도록 2배 크기로 그려요
canvas.width = W * 2;
canvas.height = H * 2;
ctx.scale(2, 2);

// ===== 2. 게임 정보 =====
let state = "ready";  // ready(시작 전), playing(게임 중), between(스테이지 사이), over(게임 오버)
let score = 0;
let lives = START_LIVES;
let stage = 1;
let ship = {};
let aliens = [];
let shots = [];       // 내 총알들
let alienShots = [];  // 외계인 총알들
let items = [];       // 떨어지는 아이템들
let sparks = [];      // 폭발 불꽃들
let alienDirection = 1;   // 1이면 오른쪽, -1이면 왼쪽
let alienShotTimer = 0;   // 외계인이 다음에 쏠 때까지 남은 시간
let diveTimer = 0;        // 다음 급강하까지 남은 시간
let breakTimer = 0;       // 스테이지 사이 쉬는 시간이 얼마나 남았는지
let shotTimer = 0;        // 내가 다음에 쏠 수 있을 때까지 남은 시간
let time = 0;             // 게임이 켜진 뒤 지난 시간 (움직이는 그림에 써요)

const input = { left: false, right: false, keyFire: false, mouseFire: false };

// 배경 별 만들기
const stars = [];
for (let i = 0; i < 130; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 0.5 + Math.random() * 1.6,
    speed: 6 + Math.random() * 26,
    twinkle: Math.random() * 6
  });
}

// 게임을 처음 상태로 되돌리기
function resetGame() {
  score = 0;
  lives = START_LIVES;
  stage = 1;
  items = [];
  sparks = [];
  ship = {
    x: W / 2,
    alive: true,
    shield: false,   // 방어막이 있는지
    doubleTime: 0,   // 두 발 쏘기가 남은 시간
    safeTime: 0      // 안 다치는 시간이 얼마나 남았는지
  };
  startStage();
}

// 새 스테이지의 외계인을 줄 세우기
function startStage() {
  shots = [];
  alienShots = [];
  aliens = [];
  alienDirection = 1;
  alienShotTimer = 1.5;
  diveTimer = 3;
  shotTimer = 0;

  const startX = (W - (COLS - 1) * ALIEN_GAP_X) / 2;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const x = startX + col * ALIEN_GAP_X;
      const y = 85 + row * ALIEN_GAP_Y;
      aliens.push({
        x: x,          // 지금 위치
        y: y,
        homeX: x,      // 대열 속 내 자리
        homeY: y,
        row: row,
        col: col,
        dive: null,    // 급강하 중이면 그 정보가 들어가요
        angle: 0       // 급강하할 때 기울어진 각도
      });
    }
  }
}

// 우주선을 움직일 수 있는 때인지 알려줘요
function canControl() {
  return state === "playing" || state === "between";
}

// ===== 3. 조작 =====
function startGame() {
  resetGame();
  state = "playing";
  overlay.style.display = "none";
}

button.addEventListener("click", startGame);

window.addEventListener("keydown", function (event) {
  if (event.code === "ArrowLeft") input.left = true;
  if (event.code === "ArrowRight") input.right = true;
  if (event.code === "Space") input.keyFire = true;

  // 게임 중에는 키보드 때문에 화면이 움직이지 않게 막아요
  const isGameKey = ["ArrowLeft", "ArrowRight", "Space"].includes(event.code);
  if (canControl() && isGameKey) event.preventDefault();
});

window.addEventListener("keyup", function (event) {
  if (event.code === "ArrowLeft") input.left = false;
  if (event.code === "ArrowRight") input.right = false;
  if (event.code === "Space") input.keyFire = false;
});

window.addEventListener("mousemove", function (event) {
  if (!canControl()) return;
  // 브라우저 속 마우스 위치를 게임 화면 위치로 바꿔요
  const box = canvas.getBoundingClientRect();
  ship.x = (event.clientX - box.left) / box.width * W;
  keepShipInside();
});

window.addEventListener("mousedown", function (event) {
  if (event.button === 0 && canControl()) input.mouseFire = true;
});

window.addEventListener("mouseup", function () {
  input.mouseFire = false;
});

// 다른 창으로 넘어가면 누르던 키를 모두 뗀 것으로 처리해요
window.addEventListener("blur", function () {
  input.left = false;
  input.right = false;
  input.keyFire = false;
  input.mouseFire = false;
});

function keepShipInside() {
  ship.x = Math.max(30, Math.min(W - 30, ship.x));
}

// ===== 4. 게임 규칙 =====
function update(dt) {
  moveShip(dt);
  moveShots(dt);
  moveItems(dt);
  moveAliens(dt);
  letAliensDive(dt);
  letAliensShoot(dt);
  checkHits();
}

// 스테이지 사이: 외계인은 없고, 남은 아이템은 주울 수 있어요
function updateBreak(dt) {
  moveShip(dt);
  moveShots(dt);
  moveItems(dt);
  catchItems();

  breakTimer -= dt;
  if (breakTimer <= 0) {
    stage += 1;
    state = "playing";
    startStage();
  }
}

function moveShip(dt) {
  if (input.left) ship.x -= SHIP_SPEED * dt;
  if (input.right) ship.x += SHIP_SPEED * dt;
  keepShipInside();

  ship.safeTime = Math.max(0, ship.safeTime - dt);
  ship.doubleTime = Math.max(0, ship.doubleTime - dt);

  shotTimer -= dt;
  if ((input.keyFire || input.mouseFire) && shotTimer <= 0) {
    if (ship.doubleTime > 0) {
      shots.push({ x: ship.x - 11, y: SHIP_Y - 18 });
      shots.push({ x: ship.x + 11, y: SHIP_Y - 18 });
    } else {
      shots.push({ x: ship.x, y: SHIP_Y - 26 });
    }
    shotTimer = SHOT_DELAY;
  }
}

function moveItems(dt) {
  for (const item of items) item.y += ITEM_SPEED * dt;
  items = items.filter(function (item) { return item.y < H + 20; });
}

// 우주선에 닿은 아이템을 먹어요
function catchItems() {
  for (const item of items) {
    if (Math.abs(item.x - ship.x) < 40 && Math.abs(item.y - SHIP_Y) < 34) {
      item.used = true;
      if (item.type === "green") ship.doubleTime = DOUBLE_TIME;
      if (item.type === "yellow") ship.shield = true;
      makeSparks(item.x, item.y, item.type === "green" ? "#5dffa0" : "#ffe066", 12);
    }
  }
  items = items.filter(function (item) { return !item.used; });
}

// 10% 확률로 아이템을 떨어뜨려요. 두 종류가 나올 확률은 반반이에요
function maybeDropItem(x, y) {
  if (Math.random() < ITEM_CHANCE) {
    items.push({ x: x, y: y, type: Math.random() < 0.5 ? "green" : "yellow" });
  }
}

function moveShots(dt) {
  for (const shot of shots) shot.y -= SHOT_SPEED * dt;
  for (const shot of alienShots) shot.y += ALIEN_SHOT_SPEED * dt;

  // 화면 밖으로 나간 총알은 지워요
  shots = shots.filter(function (shot) { return shot.y > -20; });
  alienShots = alienShots.filter(function (shot) { return shot.y < H + 20; });
}

function moveAliens(dt) {
  // 스테이지가 높을수록, 외계인이 줄어들수록 빨라져요
  const speed = alienSpeed();
  const step = speed * dt * alienDirection;

  let leftEdge = W;
  let rightEdge = 0;
  for (const alien of aliens) {
    leftEdge = Math.min(leftEdge, alien.homeX);
    rightEdge = Math.max(rightEdge, alien.homeX);
  }

  // 벽에 닿으면 방향을 바꾸고 한 칸 내려와요
  if (leftEdge + step < 28 || rightEdge + step > W - 28) {
    alienDirection = -alienDirection;
    for (const alien of aliens) alien.homeY += ALIEN_DROP;
  } else {
    for (const alien of aliens) alien.homeX += step;
  }

  // 대열에 있는 외계인은 자기 자리에, 급강하 중이면 곡선을 따라가요
  for (const alien of aliens) {
    if (alien.dive) {
      moveDiver(alien, speed, dt);
    } else {
      alien.x = alien.homeX;
      alien.y = alien.homeY;
    }
  }
}

function alienSpeed() {
  const killed = ROWS * COLS - aliens.length;
  return ALIEN_SPEED + (stage - 1) * STAGE_SPEED_UP + killed * ALIEN_SPEED_UP;
}

// 가끔 외계인 하나를 골라 급강하를 시켜요
function letAliensDive(dt) {
  if (stage < DIVE_START_STAGE) return;

  diveTimer -= dt;
  if (diveTimer > 0) return;

  // 스테이지가 높을수록 더 자주 내려와요
  diveTimer = Math.max(1.2, 4.5 - stage * 0.4) * (0.7 + Math.random() * 0.6);

  const waiting = aliens.filter(function (alien) { return !alien.dive; });
  const divingCount = aliens.length - waiting.length;
  const maxDivers = 1 + Math.floor(stage / 3);
  if (waiting.length > 0 && divingCount < maxDivers) {
    startDive(waiting[Math.floor(Math.random() * waiting.length)]);
  }
}

function startDive(alien) {
  // 조절점 두 개가 곡선을 휘게 만들어요. side는 처음 휘는 방향이에요
  const side = Math.random() < 0.5 ? -1 : 1;
  const targetX = ship.x;
  alien.dive = {
    phase: "down",
    progress: 0,   // 0이면 출발, 1이면 도착
    time: Math.max(1.4, 2.8 - stage * 0.15),
    startX: alien.x,
    startY: alien.y,
    bend1X: limitX(alien.x + side * 220),
    bend1Y: alien.y + 40,
    bend2X: limitX(targetX - side * 260),
    bend2Y: alien.y + (H - alien.y) * 0.55,
    endX: limitX(targetX + side * 60),
    endY: H + 40
  };
}

function limitX(x) {
  return Math.max(30, Math.min(W - 30, x));
}

// 곡선 위의 한 점을 구해요 (t: 0에서 1 사이)
function curvePoint(a, b, c, d, t) {
  const u = 1 - t;
  return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d;
}

function moveDiver(alien, speed, dt) {
  const dive = alien.dive;

  if (dive.phase === "down") {
    dive.progress += dt / dive.time;

    // 화면 아래로 나가면 위에서 다시 나타나 자기 자리로 돌아가요
    if (dive.progress >= 1) {
      dive.phase = "back";
      alien.x = alien.homeX;
      alien.y = -30;
      alien.angle = 0;
      return;
    }

    const t = dive.progress;
    const newX = curvePoint(dive.startX, dive.bend1X, dive.bend2X, dive.endX, t);
    const newY = curvePoint(dive.startY, dive.bend1Y, dive.bend2Y, dive.endY, t);
    alien.angle = Math.atan2(newY - alien.y, newX - alien.x) - Math.PI / 2;
    alien.x = newX;
    alien.y = newY;
    return;
  }

  // 돌아가는 중: 대열보다 빠르게 움직여서 자기 자리를 따라잡아요
  const gapX = alien.homeX - alien.x;
  const gapY = alien.homeY - alien.y;
  const distance = Math.hypot(gapX, gapY);
  const move = (300 + speed) * dt;

  if (distance <= move) {
    alien.dive = null;
    alien.x = alien.homeX;
    alien.y = alien.homeY;
  } else {
    alien.x += gapX / distance * move;
    alien.y += gapY / distance * move;
  }
}

function letAliensShoot(dt) {
  alienShotTimer -= dt;
  if (alienShotTimer > 0) return;

  // 대열에 있는 외계인만 총을 쏴요
  const inLine = aliens.filter(function (alien) { return !alien.dive; });
  if (inLine.length === 0) return;

  // 아무 외계인이나 하나 고르고, 그 칸의 맨 아래 외계인이 쏴요
  const picked = inLine[Math.floor(Math.random() * inLine.length)];
  let shooter = picked;
  for (const alien of inLine) {
    if (alien.col === picked.col && alien.y > shooter.y) shooter = alien;
  }

  alienShots.push({ x: shooter.x, y: shooter.y + 16 });
  alienShotTimer = 0.6 + Math.random() * 0.8;
}

function checkHits() {
  // 내 총알이 외계인에 맞았는지 살펴요
  for (const shot of shots) {
    for (const alien of aliens) {
      if (alien.dead) continue;  // 이미 맞은 외계인은 건너뛰어요
      if (Math.abs(shot.x - alien.x) < 22 && Math.abs(shot.y - alien.y) < 22) {
        shot.used = true;
        alien.dead = true;
        score += ALIEN_SCORE;
        makeSparks(alien.x, alien.y, ROW_COLORS[alien.row], 16);
        maybeDropItem(alien.x, alien.y);
        break;
      }
    }
  }
  shots = shots.filter(function (shot) { return !shot.used; });
  aliens = aliens.filter(function (alien) { return !alien.dead; });

  catchItems();

  // 외계인 총알에 맞았는지 살펴요
  for (const shot of alienShots) {
    if (ship.safeTime > 0) break;
    if (Math.abs(shot.x - ship.x) < 22 && Math.abs(shot.y - SHIP_Y) < 20) {
      shot.used = true;
      hitShip();
    }
  }
  alienShots = alienShots.filter(function (shot) { return !shot.used; });
  if (state === "over") return;

  // 외계인과 부딪혔는지 살펴요. 부딪힌 외계인도 함께 없어져요
  for (const alien of aliens) {
    if (ship.safeTime > 0) break;
    if (Math.abs(alien.x - ship.x) < 36 && Math.abs(alien.y - SHIP_Y) < 30) {
      alien.dead = true;
      makeSparks(alien.x, alien.y, ROW_COLORS[alien.row], 16);
      hitShip();
    }
  }
  aliens = aliens.filter(function (alien) { return !alien.dead; });
  if (state === "over") return;

  // 대열이 땅까지 내려오면 목숨이 남아 있어도 게임 오버
  for (const alien of aliens) {
    if (!alien.dive && alien.y > H - 30) {
      lives = 0;
      endGame();
      return;
    }
  }

  // 외계인을 다 물리치면 잠깐 쉬고 다음 스테이지로 가요
  if (aliens.length === 0) {
    state = "between";
    breakTimer = STAGE_BREAK;
    alienShots = [];
  }
}

// 우주선이 맞았을 때: 방어막이 있으면 막고, 없으면 목숨이 줄어요
function hitShip() {
  if (ship.shield) {
    ship.shield = false;
    ship.safeTime = 1;
    makeSparks(ship.x, SHIP_Y, "#ffe066", 24);
    return;
  }

  lives -= 1;
  if (lives <= 0) {
    endGame();
  } else {
    ship.safeTime = SAFE_TIME;
    makeSparks(ship.x, SHIP_Y, "#9fd8ff", 24);
  }
}

function endGame() {
  state = "over";
  input.mouseFire = false;
  ship.alive = false;
  makeSparks(ship.x, SHIP_Y, "#9fd8ff", 40);

  titleText.textContent = "게임 오버";
  titleText.className = "lose";
  messageText.textContent = "점수: " + score + "  /  스테이지: " + stage;
  button.textContent = "다시 시작";
  overlay.style.display = "flex";

  // 게임 중 클릭하던 손이 바로 버튼을 누르지 않게 잠깐 잠가요
  button.disabled = true;
  setTimeout(function () { button.disabled = false; }, 600);
}

function makeSparks(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 170;
    sparks.push({
      x: x,
      y: y,
      moveX: Math.cos(angle) * speed,
      moveY: Math.sin(angle) * speed,
      life: 0.35 + Math.random() * 0.4,
      color: color
    });
  }
}

// 별과 불꽃은 게임이 끝나도 계속 움직여요
function updateBackground(dt) {
  for (const star of stars) {
    star.y += star.speed * dt;
    if (star.y > H) {
      star.y = 0;
      star.x = Math.random() * W;
    }
  }

  for (const spark of sparks) {
    spark.x += spark.moveX * dt;
    spark.y += spark.moveY * dt;
    spark.life -= dt;
  }
  sparks = sparks.filter(function (spark) { return spark.life > 0; });
}

// ===== 5. 그리기 =====
function draw() {
  drawBackground();
  for (const alien of aliens) drawAlien(alien);
  for (const shot of shots) drawShot(shot);
  for (const shot of alienShots) drawAlienShot(shot);
  for (const item of items) drawItem(item);

  // 안 다치는 시간에는 우주선이 깜빡여요
  const blinkOff = ship.safeTime > 0 && Math.floor(time * 12) % 2 === 0;
  if (ship.alive && !blinkOff) drawShip();

  drawSparks();
  drawInfo();
  if (state === "between") drawStageClear();
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0a0b25");
  sky.addColorStop(1, "#141038");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#ffffff";
  for (const star of stars) {
    ctx.globalAlpha = 0.45 + 0.45 * Math.sin(time * 2 + star.twinkle);
    ctx.fillRect(star.x, star.y, star.size, star.size);
  }
  ctx.globalAlpha = 1;
}

// 별 모양 그리기
function drawStar(x, y, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? radius : radius * 0.45;
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    ctx.lineTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r);
  }
  ctx.closePath();
  ctx.fill();
}

// 내 우주선: 초승달 날개 사이에 빛나는 별이 박힌 모양
function drawShip() {
  ctx.save();
  ctx.translate(ship.x, SHIP_Y);

  // 엔진 불꽃
  const flame = 12 + Math.sin(time * 30) * 4;
  ctx.fillStyle = "#ffb347";
  ctx.beginPath();
  ctx.moveTo(-5, 12);
  ctx.lineTo(0, 12 + flame);
  ctx.lineTo(5, 12);
  ctx.closePath();
  ctx.fill();

  // 초승달 날개
  ctx.fillStyle = "#5bc8ff";
  ctx.beginPath();
  ctx.moveTo(-28, -16);
  ctx.quadraticCurveTo(-26, 14, 0, 16);
  ctx.quadraticCurveTo(26, 14, 28, -16);
  ctx.quadraticCurveTo(15, 3, 0, 5);
  ctx.quadraticCurveTo(-15, 3, -28, -16);
  ctx.fill();

  // 몸통
  ctx.fillStyle = "#e9f4ff";
  ctx.beginPath();
  ctx.moveTo(0, -26);
  ctx.quadraticCurveTo(10, -6, 7, 10);
  ctx.lineTo(-7, 10);
  ctx.quadraticCurveTo(-10, -6, 0, -26);
  ctx.fill();

  // 가운데 별
  ctx.shadowColor = "#ffe28a";
  ctx.shadowBlur = 12;
  drawStar(0, -3, 6 + Math.sin(time * 5), "#ffc94d");

  // 방어막
  if (ship.shield) {
    ctx.shadowColor = "#ffe066";
    ctx.strokeStyle = "#ffe066";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, -2, 37 + Math.sin(time * 6) * 1.5, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// 외계인: 줄마다 모양이 달라요
function drawAlien(alien) {
  ctx.save();
  ctx.translate(alien.x, alien.y);
  ctx.rotate(alien.angle);
  const color = ROW_COLORS[alien.row];
  const wave = Math.sin(time * 5 + alien.col * 0.7);

  if (alien.row === 0) drawJellyfish(color, wave);
  if (alien.row === 1) drawCrystal(color, wave);
  if (alien.row === 2) drawRingBall(color, wave);
  if (alien.row === 3) drawMoth(color, wave);

  ctx.restore();
}

function drawEye(x, y, size) {
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#14122e";
  ctx.beginPath();
  ctx.arc(x, y + size * 0.3, size * 0.5, 0, Math.PI * 2);
  ctx.fill();
}

// 1번째 줄: 다리가 흔들리는 해파리
function drawJellyfish(color, wave) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  for (let i = -1.5; i <= 1.5; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 8, 0);
    ctx.quadraticCurveTo(i * 8 + wave * 6, 9, i * 9 - wave * 3, 17);
    ctx.stroke();
  }

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, 18, Math.PI, 0);
  ctx.closePath();
  ctx.fill();

  drawEye(-7, -7, 4);
  drawEye(7, -7, 4);
}

// 2번째 줄: 조각이 둥실둥실 떠 있는 눈 달린 수정
function drawCrystal(color, wave) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(13, 0);
  ctx.lineTo(0, 18);
  ctx.lineTo(-13, 0);
  ctx.closePath();
  ctx.fill();

  for (const side of [-1, 1]) {
    const y = wave * 4 * side;
    ctx.beginPath();
    ctx.moveTo(side * 16, y);
    ctx.lineTo(side * 21, y - 7);
    ctx.lineTo(side * 26, y);
    ctx.lineTo(side * 21, y + 7);
    ctx.closePath();
    ctx.fill();
  }

  drawEye(0, 0, 6);
}

// 3번째 줄: 고리가 기우뚱거리는 작은 행성
function drawRingBall(color, wave) {
  const tilt = -0.35 + wave * 0.2;

  // 뒤쪽 고리
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, 0, 25, 8, tilt, Math.PI, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fill();

  drawEye(-5, -3, 3.5);
  drawEye(5, -3, 3.5);

  // 앞쪽 고리
  ctx.strokeStyle = "#e6fff6";
  ctx.beginPath();
  ctx.ellipse(0, 0, 25, 8, tilt, 0, Math.PI);
  ctx.stroke();
}

// 4번째 줄: 날개를 파닥이는 우주 나방
function drawMoth(color, wave) {
  const flap = 0.75 + wave * 0.25;

  ctx.fillStyle = color;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(side * 13 * flap, -3, 13 * flap, 11, side * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(side * 9 * flap, 9, 8 * flap, 7, -side * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // 더듬이
  ctx.strokeStyle = "#dfe6ff";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.quadraticCurveTo(side * 3, -17, side * 9, -18);
    ctx.stroke();
  }

  // 몸통
  ctx.fillStyle = "#26225a";
  ctx.beginPath();
  ctx.ellipse(0, 2, 5, 13, 0, 0, Math.PI * 2);
  ctx.fill();

  drawEye(0, -5, 3);
}

function drawShot(shot) {
  ctx.save();
  ctx.shadowColor = "#7fe9ff";
  ctx.shadowBlur = 10;
  ctx.fillStyle = "#e9fdff";
  ctx.fillRect(shot.x - 2, shot.y - 8, 4, 16);
  ctx.restore();
}

function drawAlienShot(shot) {
  ctx.save();
  ctx.shadowColor = "#ff5d6c";
  ctx.shadowBlur = 10;
  ctx.fillStyle = "#ffb0a0";
  ctx.beginPath();
  ctx.moveTo(shot.x, shot.y - 9);
  ctx.lineTo(shot.x + 5, shot.y);
  ctx.lineTo(shot.x, shot.y + 9);
  ctx.lineTo(shot.x - 5, shot.y);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 아이템: 초록은 총알 두 개, 노랑은 방패 그림이 들어 있어요
function drawItem(item) {
  const isGreen = item.type === "green";

  ctx.save();
  ctx.translate(item.x, item.y);
  ctx.shadowColor = isGreen ? "#5dffa0" : "#ffe066";
  ctx.shadowBlur = 14;
  ctx.fillStyle = isGreen ? "#2fd47c" : "#ffd23f";
  ctx.beginPath();
  ctx.arc(0, 0, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  if (isGreen) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-6, -8, 4, 16);
    ctx.fillRect(2, -8, 4, 16);
  } else {
    ctx.fillStyle = "#6b4e00";
    ctx.beginPath();
    ctx.moveTo(-8, -8);
    ctx.lineTo(8, -8);
    ctx.quadraticCurveTo(8, 4, 0, 10);
    ctx.quadraticCurveTo(-8, 4, -8, -8);
    ctx.fill();
  }
  ctx.restore();
}

function drawHeart(x, y, color) {
  const s = 12;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.1, x, y - s * 0.3);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9);
  ctx.fill();
}

function drawSparks() {
  for (const spark of sparks) {
    ctx.globalAlpha = Math.min(1, spark.life * 2.5);
    ctx.fillStyle = spark.color;
    ctx.fillRect(spark.x - 1.5, spark.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function drawInfo() {
  if (state === "ready") return;
  ctx.fillStyle = "#e8ecff";
  ctx.font = "bold 20px 'Malgun Gothic', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("점수 " + score, 18, 32);
  ctx.textAlign = "center";
  ctx.fillText("스테이지 " + stage, W / 2, 32);

  // 목숨: 남은 만큼 빨간 하트, 잃은 만큼 어두운 하트
  for (let i = 0; i < START_LIVES; i++) {
    const x = W - 30 - (START_LIVES - 1 - i) * 34;
    drawHeart(x, 25, i < lives ? "#ff4d6d" : "#3a3a5c");
  }

  // 지금 켜져 있는 아이템 효과
  const effects = [];
  if (ship.doubleTime > 0) effects.push("두 발 " + Math.ceil(ship.doubleTime) + "초");
  if (ship.shield) effects.push("방어막");
  ctx.fillStyle = "#bff7d0";
  ctx.font = "bold 15px 'Malgun Gothic', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(effects.join("  ·  "), 18, 56);
}

// 스테이지를 깨면 잠깐 나오는 글자
function drawStageClear() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.shadowColor = "#5dffc0";
  ctx.shadowBlur = 20;
  ctx.fillStyle = "#5dffc0";
  ctx.font = "bold 84px 'Malgun Gothic', sans-serif";
  ctx.fillText("클리어!", W / 2, H / 2 - 10);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#e8ecff";
  ctx.font = "bold 28px 'Malgun Gothic', sans-serif";
  ctx.fillText("다음은 스테이지 " + (stage + 1), W / 2, H / 2 + 45);
  ctx.restore();
}

// ===== 6. 게임 돌리기 =====
// 1초에 수십 번 "움직이고 → 다시 그리기"를 되풀이해요
let lastTime = performance.now();

function gameLoop(now) {
  // 게임이 잠깐 멈춰도 물체가 순간이동하지 않게 시간을 제한해요
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  time += dt;

  if (state === "playing") update(dt);
  if (state === "between") updateBreak(dt);
  updateBackground(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

resetGame();
requestAnimationFrame(gameLoop);
</script>
